name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # Phase A.14k: GH Pages static export can't include Edge Function routes.
      # Temporarily move /api/* out of the build tree, then restore after.
      # /api/comments will return live once Vercel migration (J23/J24) completes.
      - name: Exclude /api routes for static export (gh-pages only)
        run: |
          if [ -d "app/api" ]; then
            mv app/api app/_api_excluded_for_static_export
          fi

      - name: Build (static export)
        run: npm run build
        env:
          NODE_ENV: production
          DEPLOY_TARGET: gh-pages

      - name: Restore /api routes post-build
        if: always()
        run: |
          if [ -d "app/_api_excluded_for_static_export" ]; then
            mv app/_api_excluded_for_static_export app/api
          fi

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.sha }}'
