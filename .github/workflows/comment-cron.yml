name: Comment Cron — Auto-PR

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hr
  workflow_dispatch:        # manual trigger (Julz can "process now")

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: comment-cron
  cancel-in-progress: false   # let in-flight runs finish

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps
      - name: Process comments
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_DAILY_USD: "30"
        run: node scripts/process-comments.mjs
        timeout-minutes: 30
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cron-${{ github.run_id }}
          path: scripts/cron-output/
          retention-days: 30
