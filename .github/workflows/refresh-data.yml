name: refresh-data

# Part A — Cloud 24/7 auto-refresh (Sprint 1). Polls token-auth sources, merges
# canonical, and pushes to main ONLY on data delta -> Vercel auto-redeploys.
# SideShift is NOT here (login-gated, no browser in cloud) -> handled by the local
# Windows task (scripts/refresh-local.ps1). Schedule-only triggers => no commit loop.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Poll Linear pipeline (graceful NEEDS-SECRETS exit if unset)
        run: node scripts/poll-linear-pipeline.mjs || echo "linear poll non-fatal"
        env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
          LINEAR_PROJECT_NAME: UGC Pipeline

      - name: Poll Gmail brand inbox (graceful NEEDS-SECRETS exit if unset)
        run: node scripts/poll-gmail-brand.mjs || echo "gmail poll non-fatal"
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      - name: Merge canonical (delta-merge, --apply)
        run: node scripts/merge-canonical.mjs --apply || echo "merge non-fatal"

      - name: Regenerate JSON the app imports
        run: node scripts/jsonl-to-json.mjs || echo "json regen non-fatal"

      - name: Commit + push ONLY on data delta (Vercel redeploys)
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "refresh-data: auto-poll (cloud)"
            git push origin main
            echo "pushed data delta -> Vercel will redeploy"
          else
            echo "no data delta - nothing to push"
          fi