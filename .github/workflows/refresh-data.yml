name: refresh-data

# Cron every 15 min. Today: just rebuilds + redeploys (mock-only).
# Future: rsync from UGC workspace, then rebuild + redeploy.
#
# ⚠️ DATA ISOLATION GUARDRAIL
# This workflow MUST NEVER sync from:
#   - OneDrive/Desktop/julz-vault/
#   - juliannesilla.github.io/julz-command-center/
#   - any *financial*, *household*, *identity-theft*, *post-hdmz*, *RJ* paths
# Allowed source: OneDrive/Desktop/UGC/** only.
#
# ⚠️ DISABLED 2026-05-20 (Phase A.14c) — manual trigger only.
# Root cause of prior failures (per C3 diagnosis):
#   1. Uses pnpm + frozen-lockfile, but repo has package-lock.json (npm)
#   2. Uses actions/deploy-pages@v4 (requires Pages build_type=workflow),
#      but Pages is configured with build_type=legacy + source=gh-pages
#      to match deploy.yml's peaceiris/actions-gh-pages strategy.
# Re-enable by uncommenting schedule + push triggers ONLY AFTER:
#   (a) generating pnpm-lock.yaml OR rewriting to npm install
#   (b) deciding pnpm-lock.yaml strategy: ship lockfile or switch to npm install
#   (c) reconciling Pages build strategy with deploy.yml
# OR replace this workflow with rsync step + deploy.yml trigger (cleaner).

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # TODO(D-5 live swap): once UGC tokens exist, uncomment rsync step.
      # - name: Mirror UGC workspace (allowed paths only)
      #   run: |
      #     mkdir -p data/ugc-mirror
      #     rsync -av --delete \
      #       --include='**/*.md' --include='**/*.json' \
      #       --exclude='*financial*' --exclude='*household*' \
      #       --exclude='*identity-theft*' --exclude='*post-hdmz*' \
      #       --exclude='*RJ*' --exclude='julz-vault/' \
      #       "${{ secrets.UGC_SOURCE }}/" data/ugc-mirror/

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_UGC_PASSWORD_HASH: ${{ secrets.UGC_PASSWORD_HASH }}
          UGC_PASSWORD_HASH: ${{ secrets.UGC_PASSWORD_HASH }}
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
