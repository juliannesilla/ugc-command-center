name: refresh-data

# Cron every 15 min: rebuild + redeploy. Today this is redundant with deploy.yml
# (mock-data only). When D-5 live tokens land, uncomment the rsync step below
# to mirror UGC workspace BEFORE rebuild — that's when this becomes useful.
#
# ⚠️ DATA ISOLATION GUARDRAIL
# This workflow MUST NEVER sync from:
#   - OneDrive/Desktop/julz-vault/
#   - juliannesilla.github.io/julz-command-center/
#   - any *financial*, *household*, *identity-theft*, *post-hdmz*, *RJ* paths
# Allowed source: OneDrive/Desktop/UGC/** only.
#
# ⚠️ DISABLED 2026-05-20 (Phase A.14c), rewritten 2026-05-21 (Phase A.14e Wave 8 prep)
# Strategy: npm + peaceiris/actions-gh-pages → gh-pages branch (matches deploy.yml)
# Re-enable checklist:
#   (1) Set GitHub Actions secrets: LINEAR_API_TOKEN + N8N_API_TOKEN + UGC_SOURCE
#   (2) Uncomment the "Mirror UGC workspace" rsync step below
#   (3) Uncomment the schedule + push triggers below
#   (4) Optionally add UGC_PASSWORD_HASH secret if password gate is reactivated

on:
  workflow_dispatch:
  # ── Re-enable when D-5 live data is wired (see checklist above) ──
  # schedule:
  #   - cron: '*/15 * * * *'
  # push:
  #   branches: [main]

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # TODO(D-5 live swap): once UGC tokens exist, uncomment rsync step + add
      # env block above with LINEAR_API_TOKEN / N8N_API_TOKEN / UGC_SOURCE.
      # - name: Mirror UGC workspace (allowed paths only)
      #   run: |
      #     mkdir -p data/ugc-mirror
      #     rsync -av --delete \
      #       --include='**/*.md' --include='**/*.json' \
      #       --exclude='*financial*' --exclude='*household*' \
      #       --exclude='*identity-theft*' --exclude='*post-hdmz*' \
      #       --exclude='*RJ*' --exclude='julz-vault/' \
      #       "${{ secrets.UGC_SOURCE }}/" data/ugc-mirror/

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build (static export)
        run: npm run build
        env:
          NODE_ENV: production
          # NEXT_PUBLIC_UGC_PASSWORD_HASH: ${{ secrets.UGC_PASSWORD_HASH }}
          # UGC_PASSWORD_HASH: ${{ secrets.UGC_PASSWORD_HASH }}

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'refresh-data: ${{ github.sha }}'
